# Sign + publish the APKINDEX to S3/CloudFront after gates pass. Reusable across
# package projects: `dir` is the project subdir all run steps execute inside.
name: publish
on:
  workflow_call:
    inputs:
      dir:     { type: string, required: false, default: pdo_snowflake }
      package: { type: string, required: true }
    # ABUILD_ACTIVE_KEY comes from the `Builder` environment (job below), not the caller.
  workflow_dispatch:
    inputs:
      dir:     { type: string, required: false, default: pdo_snowflake }
      package: { type: string, required: true, default: php83-pdo_snowflake }

permissions:
  contents: read                # publish writes to S3/CloudFront, not git

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Builder      # ABUILD_ACTIVE_KEY + AWS_MAIN_MMEDIA_* creds live here
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@v4
      # NB: publish must run against apks + the ACTIVE key produced by build.yml.
      # In a real pipeline, build+publish share a runner/artifacts and the key
      # comes from the secret; never publish an unverified build (gates first).
      - name: Restore signing key
        run: |
          mkdir -p .build/keys
          # name must match the committed keyring pubkey (see build.yml note)
          name=$(basename "$(ls keys/keyring/*.rsa.pub | head -1)" .pub)
          printf '%s' "${{ secrets.ABUILD_ACTIVE_KEY }}" > ".build/keys/$name"
          cp "keys/keyring/$name.pub" ".build/keys/$name.pub"
      - name: Publish (prune -> index -> sign -> sync to S3/CloudFront)
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_MAIN_MMEDIA_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_MAIN_MMEDIA_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ vars.AWS_MMEDIA_REGION }}
          PUBLISH_S3_TARGET:     ${{ vars.PUBLISH_S3_TARGET }}
        run: BACKEND=s3 ./bin/publish "${{ inputs.package }}"
      # Served via CloudFront at mmedia-stage.capturehighered.net/apk (shared
      # bucket, /apk prefix). See auto/build-pipeline.md §6.
